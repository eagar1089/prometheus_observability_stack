name: CI Pipeline
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:

# ── Job 1: Lint + Format check ─────────────────────────────────────────────────────
  code-quality:
    name: Lint + Format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff checks
        run: ruff check flaskapp/
        # Checks all .py files in flaskapp/ for style and syntax issues.
    
# # ── JOB 2: Tests ─────────────────────────────────────────────────────
  tests:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r flaskapp/requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage
        run: pytest flaskapp --cov=flaskapp -v --cov-report=term --cov-report=xml
        env:
          PYTHONPATH: .
          MONGO_URI: ${{ secrets.MONGO_URI }}
          HF_API_TOKEN: ${{ secrets.HF_TOKEN }}
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: flaskapp/coverage.xml
          flags: unittests
          name: coverage-report
          token: ${{ secrets.CODECOV_TOKEN }}

# # ── JOB 3: Security — SAST ────────────────────────────────────────────
  sast-scan:
    name: Bandit SAST scan
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit[toml]
      - name: Run Bandit security scan
        run: bandit -r flaskapp/ -x flaskapp/tests --severity-level medium -f json -o bandit-report.json || true

      - name: Show Bandit summary
        run: bandit -r flaskapp/ -x flaskapp/tests --severity-level medium || true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json

#  # JOB 4: Dependency scan
  dependency-scan:
    name: pip-audit Dependency Scan
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit -r flaskapp/requirements.txt -f json -o pip-audit-report.json || true

      - name: Show pip-audit summary
        run: pip-audit -r flaskapp/requirements.txt || true

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json